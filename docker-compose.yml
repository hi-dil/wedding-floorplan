services:
  db:
    image: postgres:16-alpine
    container_name: floor-plan-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-floorplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-floorplan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-floorplan} -d ${POSTGRES_DB:-floorplan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - floor-plan-network

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    container_name: floor-plan-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-floorplan}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - floor-plan-network
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    profiles:
      - migrate

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: floor-plan-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-floorplan}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-floorplan}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - floor-plan-network

volumes:
  postgres_data:

networks:
  floor-plan-network:
    driver: bridge
