services:
  db:
    image: postgres:16-alpine
    container_name: floor-plan-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: floorplan
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: floorplan_dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floorplan -d floorplan_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: floor-plan-app-dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://floorplan:devpassword@db:5432/floorplan_dev
      ADMIN_PASSWORD: admin123
      JWT_SECRET: dev-secret-change-in-production-32chars
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data_dev:
